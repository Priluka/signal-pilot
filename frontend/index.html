<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praxis · Signal Pilot</title>
    <script>
      // Apply the persisted theme before React mounts so there's no flash
      // of the wrong palette on first paint. Falls back to system pref if
      // the user hasn't set one yet (default is light per the spec).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.add(mode);
          document.documentElement.style.colorScheme = mode;
        } catch (_e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
